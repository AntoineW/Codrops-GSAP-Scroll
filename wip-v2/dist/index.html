<html>
  <head>
    <title>Codrops | Demo</title>


    <link href="./css/style.css" rel="stylesheet" />

    <script src="./js/script.js" type="text/javascript"></script>
  </head>

  <body>
    <canvas class="grid js-grid" aria-hidden="true"></canvas>

    <div class="page-container">

      <div class="step step--intro js-intro">
        <div class="step-inner">
          <span class="step-text js-text">
            Do not scroll
          </span>
        </div><!-- .step-inner -->
      </div><!-- .step -->

      <div class="step step--text step--1 js-step-1">
        <div class="step-inner">
          <span class="step-text js-text">
            Do
          </span><!-- .step-text -->
        </div><!-- .step-inner-->
      </div><!-- .step -->

      <div class="step step--text step--2 js-step-2">
        <div class="step-inner">
          <span class="step-text js-text">
            Not
          </span><!-- .step-text -->
        </div><!-- .step-inner-->
      </div><!-- .step -->

      <div class="step step--text step--3 js-step-3">
        <div class="step-inner">
          <span class="step-text js-text">
            Scroll
          </span><!-- .step-text -->
        </div><!-- .step-inner-->
      </div><!-- .step -->

    </div><!-- .page-container-->
  </body>
</html>
